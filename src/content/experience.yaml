- id: surp
  section: Research & design
  order: 1
  title: Undergraduate Researcher, Summer Undergraduate Research Program
  org: College of Nanotechnology, Science, and Engineering, University at Albany
  place: Albany, NY
  period: Jun – Aug 2025
  project: haptic-vest
  bullets:
    - Designed and built a vision-based haptic vest that helps visually impaired people navigate, mentored by Aishwari Talhan.
    - Ran object detection and monocular depth estimation together on a Raspberry Pi 5 with a Hailo-8 AI accelerator.
    - Trained a custom YOLOv8 model to recognize staircases, exit signs and doors.
    - Presented the vest at the SURP poster session on Aug 7, 2025; the work was featured by UAlbany News.
  link:
    label: UAlbany News article
    url: https://www.albany.edu/news-center/news/2025-undergrad-research-project-develops-haptics-assist-visually-impaired

